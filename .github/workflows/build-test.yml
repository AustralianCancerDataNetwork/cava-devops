name: Build and Test
on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to use
        type: string
        default: '3.12'
        required: false
      ruff:
        description: Run ruff check
        type: boolean
        default: true
        required: false
      setup-commands:
        description: >
          Shell commands to run before tests (e.g. to write a config file).
          Passed as a YAML block scalar; no external script file needed.
        type: string
        default: ''
        required: false
      ty-src:
        description: Path passed to `ty check` for type checking
        type: string
        default: 'src/'
        required: false
      sibling-repos:
        description: >
          Newline-separated repository names to check out as real siblings
          before `uv sync`, for private path dependencies not published to
          PyPI. Requires the `token` secret.
        type: string
        default: ''
        required: false
    secrets:
      token:
        description: Fine-grained PAT with Contents:read on the sibling repos — only needed if sibling-repos is set
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout sibling repos
        if: inputs.sibling-repos != ''
        env:
          GH_TOKEN: ${{ secrets.token }}
        run: |
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/AustralianCancerDataNetwork/${repo}" "../${repo}"
          done <<< "${{ inputs.sibling-repos }}"

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run setup commands
        if: inputs.setup-commands != ''
        run: ${{ inputs.setup-commands }}

      - name: Type check
        run: uv run ty check ${{ inputs.ty-src }}

      - name: Lint
        if: inputs.ruff
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q
